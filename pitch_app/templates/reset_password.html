{% extends 'base.html' %}

{% block content %}
<section class="page-card" style="max-width:400px; margin:auto;">
  <h2>Redefinir senha</h2>
  <p class="meta-note" style="margin-bottom: 20px;">
    Digite sua nova senha. Ela deve ter no mínimo 6 caracteres.
  </p>

  <form id="resetPasswordForm" method="post" style="display:grid; gap:12px;">
    <input type="hidden" name="token" value="{{ token }}">
    
    <div>
      <label for="new_password">Nova senha</label>
      <input 
        type="password" 
        id="new_password" 
        name="new_password" 
        placeholder="Digite sua nova senha"
        minlength="6"
        required
      >
    </div>

    <div>
      <label for="confirm_password">Confirmar senha</label>
      <input 
        type="password" 
        id="confirm_password" 
        name="confirm_password" 
        placeholder="Digite novamente"
        minlength="6"
        required
      >
    </div>

    {% if error %}
      <div class="card-note" style="background: #fef2f2; border-color: #fca5a5; color: #991b1b;">
        {{ error }}
      </div>
    {% endif %}

    <button id="resetPasswordBtn" type="submit" class="primary-btn">
      Salvar nova senha
    </button>

    <a href="/login" class="secondary-btn" style="text-align: center;">
      Voltar para o login
    </a>
  </form>
</section>

<script>
  const form = document.getElementById("resetPasswordForm");
  const button = document.getElementById("resetPasswordBtn");

  form.addEventListener('submit', function(e) {
    const password = document.getElementById('new_password').value;
    const confirm = document.getElementById('confirm_password').value;

    if (password !== confirm) {
      e.preventDefault();
      alert('As senhas não coincidem. Por favor, digite novamente.');
      return false;
    }

    if (password.length < 6) {
      e.preventDefault();
      alert('A senha deve ter no mínimo 6 caracteres.');
      return false;
    }

    // 🔥 evita duplo envio (seu problema)
    button.disabled = true;
    button.innerText = "Salvando...";
  });
</script>
{% endblock %}
