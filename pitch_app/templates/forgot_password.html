{% extends 'base.html' %}

{% block content %}
<section class="page-card" style="max-width:400px; margin:auto;">
  <h2>Esqueci minha senha</h2>
  <p class="meta-note" style="margin-bottom: 20px;">
    Digite seu email cadastrado e enviaremos instruções para redefinir sua senha.
  </p>

  <form method="post" style="display:grid; gap:12px;">
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="seu@email.com" required>
    </div>

    {% if message %}
      <div class="card-note" style="background: #f0fdf4; border-color: #86efac; color: #166534;">
        {{ message }}
      </div>
    {% endif %}

    <button type="submit" class="primary-btn">Enviar instruções</button>

    <a href="/login" class="secondary-btn" style="text-align: center;">
      Voltar para o login
    </a>
  </form>
</section>
{% endblock %}
