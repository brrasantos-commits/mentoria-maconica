{% extends 'base.html' %}

{% block content %}
<section class="page-card" style="max-width:800px; margin:auto;">
  <h2>Roleplay com IA</h2>

  <div id="warning" style="
    display:none;
    background:#fff3cd;
    border:1px solid #ffeeba;
    color:#856404;
    padding:12px;
    border-radius:10px;
    margin-bottom:10px;
    font-size:14px;
  ">
    ⚠️ Selecione materiais de estudo antes de iniciar o roleplay.
  </div>

  <div id="chat" style="height:400px; overflow:auto; border:1px solid #ddd; padding:12px; margin-bottom:10px;"></div>

  <form id="chatForm">
    <input type="text" id="message" placeholder="Digite sua resposta..." style="width:80%;" required disabled>
    <button type="submit">Enviar</button>
  </form>
</section>

<script>
const warning = document.getElementById("warning");
const input = document.getElementById("message");
const button = document.querySelector("#chatForm button");

// 🔥 função central de controle
function updateRoleplayLock() {
  let materials = [];

  if (typeof getSelectedMaterials === "function") {
    materials = getSelectedMaterials();
  }

  if (!materials || materials.length === 0) {
    warning.style.display = "block";
    input.disabled = true;
    button.disabled = true;
  } else {
    warning.style.display = "none";
    input.disabled = false;
    button.disabled = false;
  }
}

// 🔥 executa ao carregar
updateRoleplayLock();

// 🔥 escuta mudanças vindas da tela de estudo
window.addEventListener("materials-updated", function (e) {
  updateRoleplayLock();
});

window.addEventListener("materials-updated", function (e) {
  const materials = e.detail || [];

  if (materials.length === 0) {
    warning.style.display = "block";
    input.disabled = true;
  } else {
    warning.style.display = "none";
    input.disabled = false;
  }
});

let history = [];

const chat = document.getElementById("chat");
const form = document.getElementById("chatForm");

function addMessage(role, text) {
  const div = document.createElement("div");
  div.style.margin = "8px 0";
  div.innerHTML = "<b>" + (role === "user" ? "Você" : "Cliente") + ":</b> " + text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  const input = document.getElementById("message");
  const message = input.value;

  addMessage("user", message);
  input.value = "";

  const formData = new FormData();
  formData.append("message", message);
  formData.append("history", JSON.stringify(history));

  const res = await fetch("/api/roleplay", {
    method: "POST",
    body: formData
  });

  const data = await res.json();

  history = data.history;

  addMessage("assistant", data.response);
});
</script>
{% endblock %}
