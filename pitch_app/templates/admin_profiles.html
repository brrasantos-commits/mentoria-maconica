{% extends "base.html" %}

{% block content %}

<div class="page-header">
  <h1>Perfis de Acesso</h1>

  <a href="/admin/perfis/new" class="primary-btn">
    ➕ Novo Perfil
  </a>
</div>

<div class="panel-card">
  <table class="table">
    <thead>
      <tr>
        <th>Perfil</th>
        <th>Descrição</th>
        <th>Status</th>
        <th>Ações</th>
      </tr>
    </thead>

    <tbody>
      {% for profile in profiles %}
      <tr>
        <td>{{ profile.name }}</td>
        <td>{{ profile.description }}</td>
        <td>
          {% if profile.active %}
            Ativo
          {% else %}
            Inativo
          {% endif %}
        </td>
        <td>
          <a class="secondary-btn" href="/admin/perfis/{{ profile.id }}/edit">
            Editar
          </a>

          <form method="post"
                action="/admin/perfis/{{ profile.id }}/delete"
                style="display:inline;"
                onsubmit="return confirm('Deseja excluir este perfil? Usuários vinculados ficarão sem perfil.');">
            <button class="secondary-btn" type="submit">
              Excluir
            </button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

{% endblock %}
