name: tests

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  api-and-e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create CI .env for docker compose
        shell: bash
        run: |
          cat > .env << 'EOF'
          # Minimal env to boot the app in CI
          SESSION_SECRET_KEY=ci-secret-key-change-me
          PORT=8000
          OPENAI_API_KEY=dummy
          # Avoid accidental admin reset in CI
          RESET_ADMIN_PASSWORD=
          EOF

      - name: Build and start app (docker compose)
        shell: bash
        run: |
          docker compose up -d --build

      - name: Wait for app health
        shell: bash
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8002/health > /dev/null; then
              echo "App is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "App did not become healthy in time"
          docker compose logs
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx pytest-playwright
          python -m playwright install --with-deps chromium

      - name: Run API tests
        shell: bash
        env:
          BASE_URL: http://localhost:8002
        run: |
          pytest -q tests/api

      - name: Run UI E2E tests (Playwright)
        shell: bash
        env:
          BASE_URL: http://localhost:8002
        run: |
          pytest -q tests/e2e --browser chromium --tracing retain-on-failure --screenshot only-on-failure

      - name: Upload Playwright artifacts (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

      - name: Dump docker logs on failure
        if: failure()
        shell: bash
        run: |
          docker compose logs

      - name: Stop containers
        if: always()
        shell: bash
        run: |
          docker compose down -v
